<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080">
  <rect width="1440" height="1080" fill="#fff"/>
  <defs>
    <style>
      .ui{font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
      .cn{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
      .small{font:500 14px Inter,Arial,sans-serif;fill:#707070}
      .micro{font:400 12px Inter,Arial,sans-serif;fill:#9a9a9a}
      .title{font:600 18px Inter,Arial,sans-serif;fill:#171717}
      .nav-cn{font:700 25px Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#171717}
      .nav-en{font:750 27px Inter,Arial,sans-serif;fill:#3ecf8e}
      .green{fill:#3ecf8e}
      .black{fill:#171717}
      .muted{fill:#707070}
      .hair{stroke:#dfdfdf;stroke-width:1.2}
      .soft{fill:#fafafa}
      .card{fill:#fff;stroke:#dfdfdf;stroke-width:1.2}
      .shadow{filter:drop-shadow(0 18px 42px rgba(0,0,0,.08))}
    </style>
  </defs>

  <text x="80" y="76" class="ui" style="font-size:28px;font-weight:650;fill:#171717">我爱 CodeX Logo 方向</text>
  <text x="80" y="106" class="micro">不是最终稿，重点看识别度、导航栏适配、是否适合 favicon / 社群头像 / 内容站品牌。</text>

  <g transform="translate(80 150)">
    <rect width="1280" height="76" rx="0" fill="#fff" stroke="#ededed"/>
    <g transform="translate(30 21)">
      <circle cx="18" cy="18" r="18" fill="#171717"/>
      <path d="M21.5 10.4c-7.1 0-12 5.1-12 12.6s5 12.6 12.2 12.6c4.3 0 7.7-1.6 9.8-4.6l-4.4-3.4c-1.3 1.7-3.1 2.6-5.3 2.6-3.8 0-6.2-2.9-6.2-7.2s2.5-7.1 6.1-7.1c2.2 0 3.9.8 5.2 2.5l4.4-3.4c-2.1-3.1-5.5-4.7-9.8-4.7z" fill="#3ecf8e"/>
      <text x="48" y="27" class="nav-cn">我爱</text>
      <text x="104" y="27" class="nav-en">CodeX</text>
    </g>
    <text x="934" y="46" class="small">实战案例</text>
    <text x="1042" y="46" class="small">新手指南</text>
    <text x="1150" y="46" class="small">高频技巧</text>
  </g>

  <g transform="translate(80 274)">
    <rect class="card shadow" width="604" height="310" rx="22"/>
    <text x="32" y="44" class="title">A. Signature C</text>
    <text x="32" y="68" class="micro">推荐方向：强识别、能直接承接现在的绿色 C favicon。</text>
    <g transform="translate(60 110)">
      <circle cx="62" cy="62" r="62" fill="#171717"/>
      <path d="M73.1 28.2c-31 0-52.2 22.5-52.2 56.1s21.8 56.1 53.1 56.1c19 0 33.6-7.3 43.4-20.6l-20.6-15.8c-5.7 7.5-13.2 11.1-22.2 11.1-15.7 0-26.1-12.5-26.1-30.6s10.6-30.6 25.7-30.6c9 0 16.3 3.7 21.9 10.8l20.6-15.7c-9.4-13.4-24.3-20.8-43.6-20.8z" fill="#3ecf8e"/>
      <path d="M82 82l34-34" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".92"/>
      <text x="156" y="61" class="nav-cn" style="font-size:44px">我爱</text>
      <text x="156" y="112" class="nav-en" style="font-size:52px">CodeX</text>
    </g>
    <text x="32" y="274" class="micro">感觉：专业、干净、像一个长期内容品牌。适合当前站点。</text>
  </g>

  <g transform="translate(756 274)">
    <rect class="card shadow" width="604" height="310" rx="22"/>
    <text x="32" y="44" class="title">B. Prompt Window</text>
    <text x="32" y="68" class="micro">更偏 Codex 使用场景：自然语言、命令、自动执行。</text>
    <g transform="translate(60 116)">
      <rect x="0" y="0" width="136" height="102" rx="24" fill="#171717"/>
      <circle cx="30" cy="28" r="6" fill="#3ecf8e"/>
      <circle cx="50" cy="28" r="6" fill="#707070"/>
      <circle cx="70" cy="28" r="6" fill="#707070"/>
      <path d="M34 60l20 14-20 14" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M72 78h34" stroke="#3ecf8e" stroke-width="8" stroke-linecap="round"/>
      <text x="168" y="48" class="nav-cn" style="font-size:44px">我爱</text>
      <text x="168" y="101" class="nav-en" style="font-size:52px">CodeX</text>
    </g>
    <text x="32" y="274" class="micro">感觉：更工具、更实战。缺点是图标细节多，小尺寸会弱一些。</text>
  </g>

  <g transform="translate(80 640)">
    <rect class="card shadow" width="604" height="310" rx="22"/>
    <text x="32" y="44" class="title">C. 52 Monogram</text>
    <text x="32" y="68" class="micro">把 52codex 变成独立品牌资产，减少“我爱”的口语感。</text>
    <g transform="translate(60 118)">
      <rect width="122" height="96" rx="25" fill="#e8faf0"/>
      <text x="24" y="67" style="font:800 46px Inter,Arial,sans-serif;fill:#171717">52</text>
      <path d="M83 27h20v42H83z" fill="#3ecf8e"/>
      <text x="154" y="45" style="font:800 44px Inter,Arial,sans-serif;fill:#171717">52</text>
      <text x="209" y="45" class="nav-en" style="font-size:49px">CodeX</text>
      <text x="156" y="91" class="cn" style="font-size:20px;font-weight:500;fill:#707070">非程序员的 Codex 实战站</text>
    </g>
    <text x="32" y="274" class="micro">感觉：更像课程/社区品牌。若未来做产品矩阵，这个方向更耐用。</text>
  </g>

  <g transform="translate(756 640)">
    <rect class="card shadow" width="604" height="310" rx="22"/>
    <text x="32" y="44" class="title">D. Editorial Wordmark</text>
    <text x="32" y="68" class="micro">不做图标，靠中英文字形比例和绿色落点建立内容站气质。</text>
    <g transform="translate(60 126)">
      <text x="0" y="52" style="font:750 48px Inter,'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#171717;letter-spacing:.2px">我爱</text>
      <text x="113" y="52" style="font:800 55px Inter,Arial,sans-serif;fill:#3ecf8e">CodeX</text>
      <rect x="113" y="69" width="145" height="5" rx="2.5" fill="#3ecf8e" opacity=".28"/>
      <text x="0" y="103" class="cn" style="font-size:19px;font-weight:500;fill:#707070">非程序员的 Codex 实战站</text>
    </g>
    <text x="32" y="274" class="micro">感觉：最稳、最内容站。缺点是缺少可独立传播的符号。</text>
  </g>

  <g transform="translate(80 1000)">
    <text class="small">我的建议：选 A 做主 logo，D 做文章封面/页脚长版。B 适合专题活动，C 适合未来课程化或社群化。</text>
  </g>
</svg>
